name: Daily Othoba scrape

on:
  schedule:
    # 21:00 UTC = 03:00 Asia/Dhaka the next day.
    # GitHub runs cron in UTC only, and may delay a job by 5-30 min under load.
    # For a daily price index that jitter is irrelevant; what matters is that
    # the scrape lands at roughly the same local hour each day.
    - cron: '0 21 * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit the day's CSV back to the repo

concurrency:
  group: daily-scrape       # never let two scrapes overlap
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330    # GitHub's hard ceiling is 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show Chrome version
        run: google-chrome --version

      - name: Scrape
        env:
          FOOD_ONLY: '1'
          SCOPE: leaf
          WORKERS: '3'
          PAGE_SIZE: '80'
          MIN_ROWS: '300'
          OUT_DIR: data
        run: python othoba_daily.py

      - name: Commit the day's data
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: othoba $(TZ=Asia/Dhaka date +%F)"
            git push
          fi

      # A second copy, in case a push ever fails or the repo is rewritten.
      # Artifacts expire, so the repo remains the system of record.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: othoba-csv
          path: data/*.csv
          retention-days: 30
          if-no-files-found: warn
