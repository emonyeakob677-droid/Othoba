name: Daily Othoba scrape

on:
  schedule:
    # 21:00 UTC = 03:00 Asia/Dhaka the next day.
    # GitHub runs cron in UTC only, and may delay a job by 5-30 min under load.
    # For a daily price index that jitter is irrelevant; what matters is that
    # the scrape lands at roughly the same local hour each day.
    - cron: '0 21 * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit the day's CSV back to the repo

concurrency:
  group: daily-scrape       # never let two scrapes overlap
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned instead of ubuntu-latest: ubuntu-latest is being migrated to
    # Ubuntu 26 (from 2026-10-19), and this job relies on the preinstalled
    # Chrome + Python 3.11 of the 24.04 image it has always run on.
    runs-on: ubuntu-24.04
    timeout-minutes: 330    # GitHub's hard ceiling is 360

    steps:
      # Node 24 versions of the actions (the @v4/@v5 ones were Node 20)
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show Chrome version
        run: google-chrome --version || echo "google-chrome not on PATH; Selenium Manager will download Chrome"

      - name: Scrape
        shell: bash          # explicit bash => pipefail, so tee does not hide a failure
        env:
          FOOD_ONLY: '1'
          SCOPE: leaf
          WORKERS: '3'
          PAGE_SIZE: '80'
          MIN_ROWS: '300'
          OUT_DIR: data
        run: |
          # One retry: a missing day can never be back-filled, and most
          # failures (site hiccup, Chrome crash, temporary block) are transient.
          if python othoba_daily.py 2>&1 | tee scrape.log; then
            exit 0
          fi
          echo "::warning::First scrape attempt failed; retrying in 5 minutes"
          sleep 300
          if python othoba_daily.py 2>&1 | tee -a scrape.log; then
            exit 0
          fi

          # Surface the scraper's own last lines as the error annotation and on
          # the run summary page, so the reason is visible without opening logs.
          tail_txt=$(tail -n 40 scrape.log)
          {
            echo "### Scrape failed — last 40 lines of scrape.log"
            echo '```'
            echo "$tail_txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          esc=$(printf '%s' "$tail_txt" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
          echo "::error title=Scrape failed::${esc}"
          exit 1

      - name: Commit the day's data
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "data: othoba $(TZ=Asia/Dhaka date +%F)"
          # The scrape takes hours; if anything was pushed meanwhile, a plain
          # push is rejected. Rebase onto the latest main and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed; retrying"
            sleep $((i * 10))
          done
          exit 1

      # A second copy, in case a push ever fails or the repo is rewritten.
      # Artifacts expire, so the repo remains the system of record.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: othoba-csv
          path: |
            data/*.csv
            scrape.log
            debug/
          retention-days: 30
          if-no-files-found: warn
